<title>{{TITLE}}</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Noto+Serif:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
/* Layout: Bluebook-style exam shell. Fixed top bar (module, timer, tools), scrolling question area, fixed bottom bar (map, back/next). Desmos docks to the right and shrinks the question area. */
:root{
  --bg:#f4f6f9; --panel:#ffffff; --ink:#1c2736; --muted:#5d6b7e; --line:#d5dbe4;
  --navy:#1f3a5f; --accent:#1a6f86; --accent-ink:#ffffff; --sel:#e4f1f5; --sel-line:#1a6f86;
  --good:#17803d; --good-bg:#e3f4e9; --bad:#b42318; --bad-bg:#fbe7e4; --warn:#a15c07; --warn-bg:#fdf0d9;
  --flag:#c2410c; --shadow:0 6px 24px rgba(20,35,55,.14);
  --font:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10161f; --panel:#18212d; --ink:#e6ebf2; --muted:#9aa8bb; --line:#2c3746;
  --navy:#9cc0ea; --accent:#5cc0d8; --accent-ink:#0b1a20; --sel:#173440; --sel-line:#5cc0d8;
  --good:#5fd08a; --good-bg:#12301f; --bad:#ff8d80; --bad-bg:#3a1713; --warn:#f0b35a; --warn-bg:#35280f;
  --flag:#ff9b63; --shadow:0 6px 24px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10161f; --panel:#18212d; --ink:#e6ebf2; --muted:#9aa8bb; --line:#2c3746;
  --navy:#9cc0ea; --accent:#5cc0d8; --accent-ink:#0b1a20; --sel:#173440; --sel-line:#5cc0d8;
  --good:#5fd08a; --good-bg:#12301f; --bad:#ff8d80; --bad-bg:#3a1713; --warn:#f0b35a; --warn-bg:#35280f;
  --flag:#ff9b63; --shadow:0 6px 24px rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{border:1.5px solid var(--navy);background:transparent;color:var(--navy);border-radius:999px;padding:8px 20px;font-weight:600}
.btn.primary{background:var(--navy);color:var(--bg)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{border-color:var(--line);color:var(--ink)}
math{font-family:"STIX Two Math","Cambria Math","Latin Modern Math","Noto Sans Math",math,serif;font-size:1.12em}
math[display="block"]{margin:.7em 0;overflow-x:auto}
#app{height:100%;display:flex;flex-direction:column}

/* intro and results screens */
.page{max-width:860px;margin:0 auto;width:100%;padding:28px max(16px,env(safe-area-inset-left,0px)) 56px max(16px,env(safe-area-inset-right,0px))}
.page h1{font-size:clamp(1.7rem,4.5vw,2.4rem);line-height:1.15;margin:.2em 0 .3em;color:var(--navy);text-wrap:balance}
.page h2{font-size:1.15rem;margin:1.6em 0 .5em;color:var(--navy)}
.eyebrow{font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.lede{color:var(--muted);max-width:62ch}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:22px 0}
.fact{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.fact b{display:block;font-family:var(--mono);font-size:1.5rem;color:var(--navy);font-variant-numeric:tabular-nums}
.fact span{font-size:.85rem;color:var(--muted)}
.rules{padding-left:1.1em;color:var(--ink);max-width:68ch}
.rules li{margin:.35em 0}
.note{background:var(--warn-bg);border:1px solid var(--warn);color:var(--ink);border-radius:8px;padding:10px 14px;font-size:.92rem;margin:14px 0}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}

/* exam shell */
.top{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top .title{font-weight:700;color:var(--navy);flex:1 1 auto;min-width:150px}
.top .title small{display:block;font-weight:500;color:var(--muted);font-size:.78rem}
.timer{display:flex;flex-direction:column;align-items:center;min-width:92px}
.timer b{font-family:var(--mono);font-size:1.3rem;font-variant-numeric:tabular-nums;line-height:1.1}
.timer.low b{color:var(--bad)}
.timer button{border:1px solid var(--line);background:transparent;border-radius:999px;font-size:.72rem;padding:1px 10px;color:var(--muted)}
.tool{display:flex;flex-direction:column;align-items:center;gap:0;border:1px solid transparent;background:transparent;padding:4px 10px;border-radius:8px;font-size:.78rem;font-weight:600;color:var(--ink)}
.tool svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7}
.tool[aria-pressed="true"]{background:var(--sel);border-color:var(--sel-line);color:var(--accent)}
.tools{display:flex;gap:4px}
.main{flex:1 1 auto;min-height:0;display:flex}
.qarea{flex:1 1 auto;min-width:0;overflow-y:auto;padding:20px max(16px,env(safe-area-inset-left,0px))}
.qwrap{max-width:1040px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:start}
.qwrap.single{grid-template-columns:1fr;max-width:720px}
@media (max-width:820px){.qwrap{grid-template-columns:1fr}}
.stem{min-width:0;font-size:1.04rem}
.stem p{margin:.6em 0}
.stem img.fig{display:block;max-width:min(100%,340px);margin:12px auto;background:#fff;border-radius:8px;border:1px solid var(--line);padding:6px}
table.dt{border-collapse:collapse;margin:12px 0;font-variant-numeric:tabular-nums}
table.dt th,table.dt td{border:1px solid var(--line);padding:6px 14px;text-align:center}
table.dt th{background:var(--sel)}
.qhead{display:flex;align-items:center;gap:10px;background:var(--navy);color:var(--bg);border-radius:8px 8px 0 0;padding:6px 12px}
.qnum{background:var(--bg);color:var(--navy);font-weight:700;border-radius:6px;min-width:28px;text-align:center;padding:0 6px;font-variant-numeric:tabular-nums}
.flag{display:flex;align-items:center;gap:6px;border:0;background:transparent;color:inherit;font-size:.86rem;padding:2px 4px}
.flag svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8}
.flag.on svg{fill:var(--flag);stroke:var(--flag)}
.flag.on{font-weight:600}
.abc{margin-left:auto;border:1.5px solid currentColor;background:transparent;border-radius:6px;font-size:.74rem;font-weight:700;padding:0 8px;letter-spacing:.04em;text-decoration:line-through}
.abc[aria-pressed="true"]{background:var(--bg);color:var(--navy);text-decoration:none}
.ans{border:1px solid var(--line);border-top:0;border-radius:0 0 8px 8px;background:var(--panel);padding:14px}
.ans .ask{font-weight:600;margin:0 0 10px}
.opt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--panel);border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;margin:0 0 9px;min-height:48px}
.opt:hover{border-color:var(--navy)}
.opt .L{flex:0 0 28px;height:28px;border-radius:50%;border:1.5px solid var(--ink);display:grid;place-items:center;font-weight:700;font-size:.9rem}
.opt .T{flex:1 1 auto;min-width:0;overflow-x:auto}
.opt.sel{border-color:var(--sel-line);background:var(--sel);box-shadow:inset 0 0 0 1px var(--sel-line)}
.opt.sel .L{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt.elim .T{text-decoration:line-through;opacity:.5}
.opt.elim .L{opacity:.5;text-decoration:line-through}
.spr label{display:block;font-weight:600;margin-bottom:6px}
.spr input{font-family:var(--mono);font-size:1.3rem;padding:8px 12px;border:1.5px solid var(--line);border-radius:8px;width:11ch;background:var(--bg);color:var(--ink)}
.spr .prev{margin-top:10px;font-size:.9rem;color:var(--muted)}
.spr details{margin-top:12px;font-size:.88rem;color:var(--muted)}
.bar{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--panel);border-top:1px solid var(--line);position:relative;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar .who{flex:1 1 0;font-size:.82rem;color:var(--muted)}
.qbtn{flex:0 0 auto;background:var(--navy);color:var(--bg);border:0;border-radius:8px;padding:7px 16px;font-weight:600;display:flex;gap:8px;align-items:center}
.bar .nav{flex:1 1 0;display:flex;justify-content:flex-end;gap:10px}
.map{position:absolute;left:50%;bottom:calc(100% + 8px);transform:translateX(-50%);width:min(560px,calc(100vw - 24px));background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:16px;z-index:30}
.map h3{margin:0 0 4px;text-align:center;font-size:1rem}
.legend{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;font-size:.78rem;color:var(--muted);margin:6px 0 12px}
.legend i{display:inline-block;width:14px;height:14px;border:1.5px dashed var(--navy);border-radius:3px;vertical-align:-2px;margin-right:4px}
.legend i.a{border-style:solid;background:var(--navy)}
.legend i.f{border:0;background:none;color:var(--flag)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:8px}
.cell{position:relative;height:44px;border:1.5px dashed var(--navy);border-radius:6px;background:var(--panel);font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums}
.cell.a{border-style:solid;background:var(--navy);color:var(--bg)}
.cell.cur{outline:3px solid var(--accent);outline-offset:1px}
.cell .fl{position:absolute;top:-7px;right:-5px;width:16px;height:16px;stroke:var(--flag);fill:var(--flag);stroke-width:1}

/* calculator */
.calc{flex:0 0 min(46vw,640px);min-width:340px;border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column}
.calc header{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-bottom:1px solid var(--line);font-weight:600;font-size:.9rem}
.calc header button{border:0;background:transparent;font-size:1.3rem;line-height:1;padding:0 6px}
#desmos{flex:1 1 auto;min-height:0;position:relative}
.dfall{padding:18px;font-size:.92rem;color:var(--muted)}
.dfall a{color:var(--accent);font-weight:600}
@media (max-width:820px){.calc{position:fixed;inset:0;flex:none;min-width:0;z-index:40;padding-top:env(safe-area-inset-top,0px)}}


/* ===== Bluebook-style exam shell ===== */
.bb{--panel:#fff;--ink:#161616;--muted:#555;--line:#cfd4de;--navy:#161616;--bg:#fff;--accent:#2f4bd6;--sel:#eef2ff;--sel-line:#2f4bd6;--flag:#c0392b;--shadow:0 6px 24px rgba(0,0,0,.22);
  --bar:#e6ecf7;--blue:#2f4bd6;--serif:"Noto Serif",Georgia,"Times New Roman",serif;--sans:Roboto,system-ui,"Segoe UI",Arial,sans-serif;
  height:100%;display:flex;flex-direction:column;background:#fff;color:#161616;font-family:var(--sans);color-scheme:light}
.bb button{font-family:var(--sans)}
.bbh{position:relative;display:grid;grid-template-columns:1fr auto 1fr;align-items:start;background:var(--bar);padding:10px 24px 8px;min-height:84px}
.bbh::after,.bbf::before{content:"";position:absolute;left:0;right:0;height:3px;background:repeating-linear-gradient(90deg,#161616 0 20px,transparent 20px 31px)}
.bbh::after{bottom:-1px}
.bbf::before{top:-1px}
.bbh .sec{font-size:1.3rem;font-weight:500;line-height:1.3}
.bbh .dirb{border:0;background:transparent;font-size:1.02rem;font-weight:500;padding:6px 0;display:flex;align-items:center;gap:6px}
.bbh .c{display:flex;flex-direction:column;align-items:center;gap:6px}
.bbh .tm{font-size:1.6rem;font-weight:500;line-height:1.2;font-variant-numeric:tabular-nums}
.bbh .c.low .tm{color:#b42318}
.bbh .hide{border:1.5px solid #161616;background:transparent;border-radius:999px;padding:1px 16px;font-size:.88rem;font-weight:700}
.bbh .r{display:flex;justify-content:flex-end;gap:14px}
.bbh .tb{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 6px;font-size:.9rem;font-weight:500;color:#161616;border-bottom:3px solid transparent}
.bbh .tb svg{width:24px;height:24px;stroke:#161616;fill:none;stroke-width:1.6}
.bbh .tb .x2{font-family:var(--serif);font-weight:700;font-size:1.35rem;line-height:24px;height:24px}
.bbh .tb[aria-pressed="true"]{border-bottom-color:#161616}
.bbm{position:absolute;right:20px;top:78px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:6px;z-index:40;min-width:200px}
.bbm button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:10px 12px;border-radius:6px;font-size:.95rem}
.bbm button:hover{background:var(--sel)}
.bbmain{flex:1 1 auto;min-height:0;display:flex;background:#fff}
.bbq{flex:1 1 auto;min-width:0;display:flex;overflow:hidden}
.bbq .pane{flex:1 1 0;min-width:0;overflow-y:auto;padding:26px clamp(16px,3vw,56px) 34px}
.bbq.one .pane{max-width:none}
.bbq.one .inner{max-width:980px;margin:0 auto}
.bbq .split{flex:0 0 14px;background:#8a8a8a;position:relative;margin:0 2px}
.bbq .split::after{content:"";position:absolute;left:50%;top:30%;width:22px;height:34px;transform:translateX(-50%);background:#161616;border-radius:4px}
.directions h2{font-family:var(--serif);font-size:1.35rem;margin:0 0 14px}
.directions ul{font-family:var(--serif);font-size:1.02rem;line-height:1.55;padding-left:1.2em;margin:0}
.directions li{margin:.4em 0}
.directions table{border-collapse:collapse;font-family:var(--serif);margin:22px 0 4px;width:100%;max-width:560px;text-align:center}
.directions th,.directions td{border:1px solid #333;padding:10px 12px;font-size:.95rem}
.directions td code{font-family:var(--mono);background:#efefef;border-radius:4px;padding:1px 6px;margin:0 3px;display:inline-block}
.bbq .qh{display:flex;align-items:stretch;background:#efefef;position:relative;margin-bottom:22px}
.bbq .qh::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:3px;background:repeating-linear-gradient(90deg,#161616 0 20px,transparent 20px 31px)}
.bbq .qn{background:#161616;color:#fff;font-size:1.3rem;font-weight:700;min-width:40px;display:grid;place-items:center;padding:6px 8px}
.bbq .mfr{border:0;background:transparent;display:flex;align-items:center;gap:8px;padding:0 14px;font-size:1.02rem;font-weight:500}
.bbq .mfr svg{width:20px;height:20px;stroke:#161616;fill:none;stroke-width:1.8}
.bbq .mfr.on svg{fill:var(--flag);stroke:var(--flag)}
.bbq .abcb{margin:5px 8px 5px auto;border:0;background:var(--blue);color:#fff;border-radius:6px;width:42px;display:grid;place-items:center;opacity:.55}
.bbq .abcb[aria-pressed="true"]{opacity:1;outline:2px solid #161616;outline-offset:1px}
.bbq .abcb svg{width:30px;height:20px}
.bbq .stem{font-family:var(--serif);font-size:1.1rem;line-height:1.7;margin-bottom:16px}
.bbq .stem p{margin:.5em 0}
.bbq .stem math[display="block"]{text-align:center}
.bbq table.dt{font-family:var(--serif)}
.bbq table.dt th,.bbq table.dt td{border:1px solid #333;background:#fff}
.bbq table.dt th{background:#f1f1f1}
.bbq .orow{display:flex;align-items:center;gap:14px;margin:0 0 16px}
.bbq .opt{flex:1 1 auto;display:flex;align-items:center;gap:18px;background:#fff;border:1.5px solid #333;border-radius:10px;padding:14px 18px;min-height:68px;margin:0;font-family:var(--serif);font-size:1.12rem;text-align:left}
.bbq .opt:hover{border-color:var(--blue)}
.bbq .opt .L{flex:0 0 32px;height:32px;border-radius:50%;border:2px solid #333;display:grid;place-items:center;font-family:var(--sans);font-weight:500;font-size:.95rem;color:#333}
.bbq .opt.sel{border:2.5px solid var(--blue);background:var(--sel);padding:13px 17px}
.bbq .opt.sel .L{background:var(--blue);border-color:var(--blue);color:#fff}
.bbq .opt.elim .T{text-decoration:line-through;opacity:.45}
.bbq .opt.elim .L{opacity:.45}
.bbq .strk{flex:0 0 28px;height:28px;border-radius:50%;border:1.5px solid #333;background:#fff;position:relative;font-family:var(--sans);font-size:.78rem;font-weight:700;display:grid;place-items:center;padding:0;color:#333}
.bbq .strk::after{content:"";position:absolute;left:-5px;right:-5px;top:50%;height:1.5px;background:#333}
.bbq .strk.on{background:#161616;color:#fff}.bbq .strk.on::after{background:#fff}
.bbq .sprbox{display:block;width:150px;height:56px;border:1.5px solid #333;border-radius:10px;background:#fff;font-family:var(--sans);font-size:1.45rem;padding:6px 14px 0;color:#161616;letter-spacing:.04em}
.bbq .sprline{height:0;border-top:1.5px solid #333;width:112px;margin:-12px 0 0 17px;position:relative}
.bbq .apv{font-family:var(--serif);font-weight:700;font-size:1.3rem;margin:34px 0 18px}
.bbq .apv span{display:block;font-weight:400;font-family:var(--sans);font-size:1.4rem;margin:8px 0 0;color:#161616;min-height:1.6em}
.bbq .kpb{display:inline-flex;align-items:center;gap:8px;background:#161616;color:#fff;border:0;border-radius:999px;padding:10px 20px;font-weight:700;font-size:1rem}
.bbq .kpb svg{width:26px;height:18px;stroke:#fff;fill:none;stroke-width:1.4}
.kp{position:absolute;right:28px;top:210px;width:min(430px,calc(100% - 40px));background:#fff;border:1.5px solid #161616;box-shadow:0 8px 26px rgba(0,0,0,.25);z-index:20;font-family:var(--sans)}
.kp .kh{background:#161616;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:10px 12px;font-weight:700;font-size:1.05rem}
.kp .kh i{font-style:normal;letter-spacing:3px;opacity:.9}
.kp .kh button{border:0;background:transparent;color:#fff;font-size:1.5rem;line-height:1;padding:0 4px}
.kp .kg{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;padding:10px;background:#f2f2f2}
.kp .kg button{height:60px;border:1px solid #ccc;border-radius:7px;background:#fff;font-size:1.7rem;box-shadow:0 2px 0 #bbb;grid-column:span 2}
.kp .kg button.s{grid-column:span 1;font-size:1.6rem}
.kp .kg button:active{transform:translateY(1px);box-shadow:none}
.bbf{position:relative;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;background:var(--bar);padding:14px 24px;min-height:72px}
.bbf .nm{font-size:1.45rem;font-weight:500}
.bbf .mid{position:relative;display:flex;justify-content:center}
.bbf .qpill{white-space:nowrap;background:#161616;color:#fff;border:0;border-radius:8px;padding:11px 20px;font-weight:700;font-size:1.02rem;display:flex;gap:8px;align-items:center}
.bbf .nv{display:flex;justify-content:flex-end;gap:12px}
.bbf .bbtn{background:var(--blue);color:#fff;border:0;border-radius:999px;padding:11px 28px;font-weight:700;font-size:1.02rem;min-width:88px}
.bbf .bbtn:disabled{opacity:.45;cursor:not-allowed}
.bb .map{color:#161616}
.calc.bbc{flex:0 0 min(44vw,580px);min-width:340px;border:0;border-right:1px solid #161616;background:#fff;display:flex;flex-direction:column}
.bbc .ch{background:#161616;color:#fff;display:flex;align-items:center;gap:10px;padding:8px 10px}
.bbc .tabs{display:flex;border:1.5px solid #fff;border-radius:8px;overflow:hidden;background:#161616}
.bbc .tabs button{border:0;background:transparent;color:#fff;padding:7px 12px;font-weight:700;font-size:.95rem;display:flex;gap:7px;align-items:center}
.bbc .tabs button.on{background:#fff;color:#161616;text-decoration:underline}
.bbc .tabs svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6}
.bbc .dots{letter-spacing:4px;margin-left:12px;opacity:.9}
.bbc .ch .x{margin-left:auto;border:0;background:transparent;color:#fff;font-size:1.8rem;line-height:1}
@media (max-width:820px){

  document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{filter=b.dataset.f;results()});
  $('#again').onclick=()=>{S.ans=[[],[]];S.flag=[[],[]];S.elim=[[],[]];S.time=[[],[]];S.left=[CFG.moduleSeconds,CFG.moduleSeconds];S.phase='intro';S.calc=false;filter='all';render()};
}
document.addEventListener('keydown',e=>{
  if(S.phase!=='exam'||S.modal||/INPUT|TEXTAREA/.test((e.target||{}).tagName||''))return;
  const it=cur(),m=S.mod,total=mods()[m].length;
  if(e.key==='ArrowRight'){if(S.i<total-1){S.i++;render()}}
  else if(e.key==='ArrowLeft'){if(S.i>0){S.i--;render()}}
  else if(it.mc&&/^[a-dA-D]$/.test(e.key)){S.ans[m][S.i]='abcd'.indexOf(e.key.toLowerCase());render()}
});
render();
})();
</script>
